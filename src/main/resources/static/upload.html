<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Upload Photos | Photos API</title>

    <style>
      :root {
        font-family: Inter, system-ui, sans-serif;
        color: #e5e7eb;
        background: #0f172a;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
      }

      .container {
        width: 100%;
        max-width: 560px;
      }

      header {
        text-align: center;
        margin-bottom: 26px;
      }

      .logo {
        display: grid;
        place-items: center;
        width: 54px;
        height: 54px;
        margin: 0 auto 16px;
        border-radius: 16px;
        background: #27346a;
        font-size: 26px;
      }

      h1 {
        margin: 0 0 8px;
        font-size: 27px;
      }

      .muted {
        color: #94a3b8;
        font-size: 13px;
      }

      .card {
        background: #1e293b;
        border: 1px solid #334155;
        border-radius: 18px;
        padding: 24px;
      }

      .field {
        margin-bottom: 18px;
      }

      .field label {
        display: block;
        font-size: 13px;
        margin-bottom: 8px;
      }

      .field input {
        width: 100%;
        padding: 12px;
        background: #0f172a;
        border: 1px solid #475569;
        border-radius: 9px;
        color: white;
      }

      .dropzone {
        display: block;
        padding: 34px 16px;
        text-align: center;
        border: 2px dashed #475569;
        border-radius: 13px;
        cursor: pointer;
        transition: 0.2s;
      }

      .dropzone:hover,
      .dropzone.dragover {
        border-color: #818cf8;
        background: #273449;
      }

      .dropzone .icon {
        font-size: 32px;
        margin-bottom: 10px;
      }

      .dropzone strong {
        display: block;
        margin-bottom: 7px;
      }

      #file {
        display: none;
      }

      .list {
        display: grid;
        gap: 10px;
        margin-top: 20px;
      }

      .item {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 10px;
        border: 1px solid #334155;
        border-radius: 11px;
        background: #0f172a;
      }

      .item img {
        width: 55px;
        height: 55px;
        object-fit: cover;
        border-radius: 8px;
      }

      .details {
        flex: 1;
        min-width: 0;
      }

      .filename {
        overflow-wrap: anywhere;
        font-size: 13px;
        font-weight: 600;
      }

      .file-status {
        margin-top: 5px;
        color: #94a3b8;
        font-size: 12px;
      }

      .success {
        color: #4ade80;
      }

      .error {
        color: #f87171;
      }

      .remove {
        border: none;
        background: transparent;
        color: #94a3b8;
        font-size: 22px;
        cursor: pointer;
      }

      .submit {
        width: 100%;
        margin-top: 22px;
        padding: 14px;
        border: none;
        border-radius: 10px;
        background: #6366f1;
        color: white;
        font-size: 14px;
        font-weight: 700;
        cursor: pointer;
      }

      .submit:hover:not(:disabled) {
        background: #818cf8;
      }

      .submit:disabled {
        cursor: not-allowed;
        opacity: 0.45;
      }

      .summary {
        margin-top: 16px;
        text-align: center;
        font-size: 13px;
        line-height: 1.6;
      }

      footer {
        margin-top: 22px;
        text-align: center;
        font-size: 13px;
      }

      footer a {
        margin: 0 8px;
        color: #a5b4fc;
        text-decoration: none;
      }
    </style>
  </head>

  <body>
    <main class="container">
      <header>
        <div class="logo">📷</div>
        <h1>Upload photos</h1>
        <p class="muted">Upload multiple images · Maximum 5 MB per image</p>
      </header>

      <section class="card">
        <div class="field">
          <label for="token">JWT access token</label>
          <input
            id="token"
            type="password"
            placeholder="Paste your access token"
            autocomplete="off"
          />
        </div>

        <label class="dropzone" id="dropzone" for="file">
          <div class="icon">☁️</div>
          <strong>Choose images or drag them here</strong>
          <span class="muted">JPG, PNG, WEBP, GIF</span>
        </label>

        <input id="file" type="file" accept="image/*" multiple />

        <div id="fileList" class="list"></div>

        <button id="uploadButton" class="submit" disabled>Upload Photos</button>

        <div id="summary" class="summary" role="status"></div>
      </section>

      <footer>
        <a href="/api">API Docs</a>
        <a href="/swagger-ui/index.html">Swagger UI</a>
      </footer>
    </main>

    <script>
      const fileInput = document.getElementById("file");
      const fileList = document.getElementById("fileList");
      const uploadButton = document.getElementById("uploadButton");
      const summary = document.getElementById("summary");
      const tokenInput = document.getElementById("token");
      const dropzone = document.getElementById("dropzone");

      const MAX_SIZE = 5 * 1024 * 1024;

      let files = [];
      let uploading = false;
      let nextId = 0;

      function updateButton() {
        const pending = files.filter(
          (item) => item.status === "pending" || item.status === "failed",
        );

        uploadButton.disabled = uploading || pending.length === 0;
        uploadButton.textContent = uploading
          ? "Uploading..."
          : `Upload ${pending.length} Photo${pending.length === 1 ? "" : "s"}`;
      }

      function addFiles(selectedFiles) {
        if (uploading) return;

        for (const file of selectedFiles) {
          if (!file.type.startsWith("image/")) {
            summary.textContent = `${file.name} is not an image.`;
            summary.className = "summary error";
            continue;
          }

          if (file.size > MAX_SIZE) {
            summary.textContent = `${file.name} exceeds 5 MB.`;
            summary.className = "summary error";
            continue;
          }

          files.push({
            id: nextId++,
            file,
            url: URL.createObjectURL(file),
            status: "pending",
            error: "",
          });
        }

        renderFiles();
      }

      fileInput.addEventListener("change", () => {
        addFiles(fileInput.files);
        fileInput.value = "";
      });

      dropzone.addEventListener("dragover", (event) => {
        event.preventDefault();
        dropzone.classList.add("dragover");
      });

      dropzone.addEventListener("dragleave", () => {
        dropzone.classList.remove("dragover");
      });

      dropzone.addEventListener("drop", (event) => {
        event.preventDefault();
        dropzone.classList.remove("dragover");
        addFiles(event.dataTransfer.files);
      });

      function removeFile(id) {
        if (uploading) return;

        const item = files.find((item) => item.id === id);
        if (!item) return;

        URL.revokeObjectURL(item.url);
        files = files.filter((item) => item.id !== id);

        renderFiles();
      }

      function renderFiles() {
        fileList.replaceChildren();

        for (const item of files) {
          const row = document.createElement("div");
          row.className = "item";

          const image = document.createElement("img");
          image.src = item.url;
          image.alt = "Photo preview";

          const details = document.createElement("div");
          details.className = "details";

          const name = document.createElement("div");
          name.className = "filename";
          name.textContent = item.file.name;

          const status = document.createElement("div");
          status.className = "file-status";

          const size = (item.file.size / 1024 / 1024).toFixed(2);

          const labels = {
            pending: "Ready",
            uploading: "Uploading...",
            success: "Uploaded successfully",
            failed: item.error || "Upload failed",
          };

          status.textContent = `${size} MB · ${labels[item.status]}`;

          if (item.status === "success") {
            status.classList.add("success");
          } else if (item.status === "failed") {
            status.classList.add("error");
          }

          details.append(name, status);
          row.append(image, details);

          if (!uploading) {
            const remove = document.createElement("button");
            remove.className = "remove";
            remove.textContent = "×";
            remove.title = "Remove photo";
            remove.setAttribute("aria-label", "Remove " + item.file.name);
            remove.onclick = () => removeFile(item.id);
            row.append(remove);
          }

          fileList.append(row);
        }

        updateButton();
      }

      async function uploadOne(item, endpoint, token) {
        item.status = "uploading";
        renderFiles();

        const formData = new FormData();
        formData.append("data", item.file);

        const headers = {
          Authorization: `Bearer ${token}`,
        };

        try {
          const response = await fetch(endpoint, {
            method: "POST",
            headers,
            body: formData,
          });

          if (!response.ok) {
            let message = `HTTP ${response.status}`;

            try {
              const error = await response.json();
              message = error.message || error.detail || message;
            } catch {
              // Server may return an empty or non-JSON error body.
            }

            throw new Error(message);
          }

          item.status = "success";
          item.error = "";
        } catch (error) {
          item.status = "failed";
          item.error = error.message || "Upload failed";
        }

        renderFiles();
      }

      uploadButton.addEventListener("click", async () => {
        if (uploading) return;

        const token = tokenInput.value.trim();

        if (!token) {
          summary.textContent = "Please enter your JWT access token.";
          summary.className = "summary error";
          return;
        }

        const pending = files.filter(
          (item) => item.status === "pending" || item.status === "failed",
        );

        if (!pending.length) return;

        const endpoint = "/api/photo";

        uploading = true;
        fileInput.disabled = true;
        summary.className = "summary";
        summary.textContent = `Uploading 0 of ${pending.length}...`;
        updateButton();

        // Each image gets its own POST request.
        // Sequential uploads keep things simple and avoid
        // overwhelming the server with many simultaneous requests.
        for (let i = 0; i < pending.length; i++) {
          await uploadOne(pending[i], endpoint, token);

          summary.textContent = `Processed ${i + 1} of ${pending.length} photos.`;
        }

        uploading = false;
        fileInput.disabled = false;

        const succeeded = pending.filter(
          (item) => item.status === "success",
        ).length;

        const failed = pending.length - succeeded;

        summary.textContent =
          `${succeeded} uploaded successfully` +
          (failed ? ` · ${failed} failed (retry available)` : " ✓");

        summary.className = failed ? "summary error" : "summary success";

        renderFiles();
      });
    </script>
  </body>
</html>
